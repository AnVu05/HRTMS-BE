server:
  port: 8080

spring:
  application:
    name: hrtms-be

  datasource:
    # Nhớ thay đổi tên database, username và password cho khớp với máy cậu nhé
    url: jdbc:sqlserver://localhost:1433;databaseName=HRTMS;encrypt=true;trustServerCertificate=true
    username: sa
    password: 12345
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect