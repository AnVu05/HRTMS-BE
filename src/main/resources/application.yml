server:
  port: 8080

spring:
  application:
    name: royalturf-management

  # Database configuration
  datasource:
    # Use H2 in-memory database by default for easy student testing
    url: jdbc:h2:mem:royalturfdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

    # Uncomment this section if you want to switch to MySQL
    # url: jdbc:mysql://localhost:3306/royalturf?useSSL=false&serverTimezone=UTC
    # username: root
    # password: yourpassword
    # driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect # Change to org.hibernate.dialect.MySQLDialect for MySQL
    hibernate:
      ddl-auto: update # Code-first approach: Auto create/update tables from JPA entities
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 Console configuration (can access via http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
